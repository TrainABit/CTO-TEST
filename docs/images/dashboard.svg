<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Strategic Plan Tracker dashboard overview</title>
  <desc id="desc">Stylised depiction of the dashboard page showing headline KPI cards, progress chart, and quick navigation tiles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)" rx="32" />
  <g transform="translate(80 64)">
    <text font-family="Inter, Segoe UI, sans-serif" font-size="36" font-weight="600" fill="#1e3a8a">Dashboard</text>
    <text y="44" font-family="Inter, Segoe UI, sans-serif" font-size="18" fill="#1f2937">Snapshot of execution health across all strategic plans.</text>
  </g>
  <g transform="translate(80 140)">
    <rect width="360" height="140" rx="20" fill="url(#card)" stroke="#bfdbfe" stroke-width="2" />
    <text x="24" y="44" font-family="Inter, Segoe UI, sans-serif" font-size="18" fill="#1f2937">Active plans</text>
    <text x="24" y="94" font-family="Inter, Segoe UI, sans-serif" font-size="54" font-weight="700" fill="#2563eb">3</text>
  </g>
  <g transform="translate(468 140)">
    <rect width="360" height="140" rx="20" fill="url(#card)" stroke="#bfdbfe" stroke-width="2" />
    <text x="24" y="44" font-family="Inter, Segoe UI, sans-serif" font-size="18" fill="#1f2937">In-flight phases</text>
    <text x="24" y="94" font-family="Inter, Segoe UI, sans-serif" font-size="54" font-weight="700" fill="#2563eb">9</text>
  </g>
  <g transform="translate(856 140)">
    <rect width="344" height="140" rx="20" fill="url(#card)" stroke="#bfdbfe" stroke-width="2" />
    <text x="24" y="44" font-family="Inter, Segoe UI, sans-serif" font-size="18" fill="#1f2937">Capital deployed</text>
    <text x="24" y="94" font-family="Inter, Segoe UI, sans-serif" font-size="36" font-weight="600" fill="#2563eb">$9.5M across portfolios</text>
  </g>
  <g transform="translate(80 320)">
    <rect width="760" height="320" rx="24" fill="url(#card)" stroke="#c7d2fe" stroke-width="2" />
    <text x="32" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#1f2937">Performance momentum</text>
    <polyline points="120,250 220,200 320,210 420,160 520,140 620,120 700,100" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" />
    <circle cx="120" cy="250" r="10" fill="#2563eb" opacity="0.7" />
    <circle cx="420" cy="160" r="10" fill="#2563eb" opacity="0.7" />
    <circle cx="700" cy="100" r="10" fill="#2563eb" opacity="0.7" />
    <text x="32" y="96" font-family="Inter, Segoe UI, sans-serif" font-size="16" fill="#4b5563">Visualises KPI trendlines aggregated from active plan phases.</text>
  </g>
  <g transform="translate(880 320)">
    <rect width="320" height="320" rx="24" fill="url(#card)" stroke="#c7d2fe" stroke-width="2" />
    <text x="32" y="60" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#1f2937">Quick actions</text>
    <g transform="translate(32 96)">
      <rect width="256" height="80" rx="18" fill="#2563eb" opacity="0.12" />
      <text x="20" y="34" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#1f2937">Review plan health</text>
      <text x="20" y="58" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#4b5563">Checklist completion, risks, KPIs</text>
    </g>
    <g transform="translate(32 196)">
      <rect width="256" height="80" rx="18" fill="#2563eb" opacity="0.12" />
      <text x="20" y="34" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#1f2937">Compare strategies</text>
      <text x="20" y="58" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#4b5563">Strengths, capital, readiness</text>
    </g>
  </g>
</svg>
